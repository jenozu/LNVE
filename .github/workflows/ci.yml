name: LNVE CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOOGLE_MAPS_KEY: test-key
      SECRET_KEY: test-secret
      FLASK_DEBUG: "0"
      DATABASE_PATH: /tmp/lnve-ci.db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile active Python modules
        run: |
          python -m py_compile             app.py             config.py             database/repository.py             scrapers/google_maps.py             web/routes/search.py             web/routes/results.py             web/routes/export.py

      - name: Run Phase 3 verification suite
        run: python -m unittest discover -s tests -p "test_phase3.py" -v

      - name: Run Phase 4 verification suite
        run: python -m unittest discover -s tests -p "test_phase4.py" -v

      - name: Verify Flask app startup/import
        run: |
          rm -f /tmp/lnve-ci.db
          python -c "import app; assert app.app; print(app.app.url_map)"
